server {
    listen 80;
    listen [::]:80;
    server_name transit.omfreight.vip;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/freight-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://transit.omfreight.vip$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name transit.omfreight.vip;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/transit.omfreight.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transit.omfreight.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FreightTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16k;
    access_log /var/log/nginx/freight-public.access.log;
    error_log /var/log/nginx/freight-public.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace user-supplied headers; the application trusts only loopback peers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
}
